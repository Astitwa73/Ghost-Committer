# Ghost Committer - OpenClaw Platform Manifest

name: ghost-committer
version: "1.0.0"
description: Autonomous overnight tech debt cleanup agent for Python repositories

schedule:
  cron: "0 2 * * *"
  timezone: Asia/Kolkata
  timeout_minutes: 60

agent:
  entry: main.py
  interpreter: python
  default_repo: "."

heartbeat:
  enabled: true
  interval_minutes: 5
  events:
    - scan_complete
    - plan_complete
    - patch_complete
    - validation_start
    - validation_retry
    - delivery_complete
    - pipeline_failed

resources:
  requires_docker: true
  requires_git: true
  requires_network: true

environment:
  dotenv: .env
  required:
    - OPENCODE_API_KEY
    - GITHUB_TOKEN
    - GITHUB_REPOSITORY
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_CHAT_ID
  optional:
    - OPENCODE_MODEL
    - OPENCODE_BASE_URL
    - OPENCODE_TIMEOUT_SECONDS
    - GITHUB_BASE_BRANCH
    - SLACK_BOT_TOKEN
    - SLACK_CHANNEL

skills_dir: skills/
